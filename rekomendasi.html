<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wisata Kuliner Lombok - Form Rekomendasi</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <nav>
                <h1><img class="logo" src="logo.png" alt="Logo Kulineria">Kulineria</h1>
                <ul>
                    <li><a href="Index.html">Home</a></li>
                    <li><a href="Daftar.html">Daftar</a></li>
                    <li class="dropdown">
                        <button type="button" class="dropdown-btn active" aria-haspopup="true">Form &#9662;</button>
                        <ul class="dropdown-menu">
                            <li><a href="rekomendasi.html">Rekomendasi</a></li>
                            <li><a href="Pemesanan.html">Pemesanan</a></li>
                            <li><a href="Ulasan.html">Ulasan</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Cari Rekomendasi Kuliner</h2>
                <p>Isi form berikut dan kami akan sarankan kuliner khas Lombok yang sesuai dengan selera anda</p>

                <form id="form-rekomendasi" novalidate>
                    <div class="form-group">
                        <label for="nama">Nama</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama anda">
                        <span class="error-msg" id="error-nama"></span>
                    </div>

                    <fieldset>
                        <legend>Jenis Kuliner</legend>
                        <div class="radio-option">
                            <input type="radio" id="berat" name="jenis" value="Makanan Berat" checked>
                            <label for="berat">Makanan Berat</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="camilan" name="jenis" value="Camilan">
                            <label for="camilan">Camilan</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="minuman" name="jenis" value="Minuman">
                            <label for="minuman">Minuman</label>
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label for="rasa">Rasa Favorit</label>
                        <select id="rasa" name="rasa">
                            <option value="">-- Pilih rasa --</option>
                            <option value="Pedas">Pedas</option>
                            <option value="Manis">Manis</option>
                            <option value="Gurih">Gurih</option>
                            <option value="Asam">Asam</option>
                        </select>
                        <span class="error-msg" id="error-rasa"></span>
                    </div>

                    <div class="form-group">
                        <label for="catatan">Catatan Tambahan (opsional)</label>
                        <textarea id="catatan" name="catatan" rows="3" placeholder="Contoh: tidak suka makanan berkuah"></textarea>
                    </div>

                    <div>
                        <button type="submit">Kirim</button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; <span id="tahun">2026</span> Kuliner Lombok</p>
        </footer>

        <script src="rekomendasi.js"></script>
    </body>
</html>
